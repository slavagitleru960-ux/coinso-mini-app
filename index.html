<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coinso Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff}.wrap{max-width:520px;margin:auto;padding:18px 14px 90px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:25px;font-weight:800}.user{opacity:.75;font-size:13px}.card{background:#151d34;border:1px solid #26314f;border-radius:20px;padding:18px;margin-bottom:14px}.balance{font-size:32px;font-weight:800;margin-top:5px}.muted{color:#94a0bb;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{border:0;border-radius:15px;padding:15px;color:#fff;background:#202b49;font-size:15px;font-weight:700;cursor:pointer}button:active{transform:scale(.98)}.green{background:#168a62}.section{font-size:18px;font-weight:800;margin:18px 2px 10px}.icon{font-size:25px;display:block;margin-bottom:7px}.nav{position:fixed;bottom:0;left:0;right:0;background:#10172a;border-top:1px solid #26314f;padding:9px;display:flex;justify-content:center;gap:8px}.nav button{padding:11px 18px;background:transparent}
</style></head>
<body><div class="wrap">
<div class="header"><div class="logo">🪙 Coinso</div><div class="user" id="username">Гость</div></div>
<div class="card"><div class="muted">Баланс LudoCoins</div><div class="balance" id="balance">0 LC</div><div class="muted">Mini App • beta</div></div>
<div class="section">🎮 Игры</div><div class="grid">
<button onclick="openGame('🎰 Рулетка')"><span class="icon">🎰</span>Рулетка</button>
<button onclick="openGame('💣 Мины')"><span class="icon">💣</span>Мины</button>
<button onclick="openGame('🎯 Дартс')"><span class="icon">🎯</span>Дартс</button>
<button onclick="openGame('🏀 Баскетбол')"><span class="icon">🏀</span>Баскетбол</button></div>
<div class="section">⚙️ Разделы</div><div class="grid">
<button onclick="show('👤 Профиль')"><span class="icon">👤</span>Профиль</button>
<button onclick="show('⛏️ Майнинг')"><span class="icon">⛏️</span>Майнинг</button>
<button onclick="show('🏆 Рейтинг')"><span class="icon">🏆</span>Рейтинг</button>
<button class="green" onclick="show('💎 Донат')"><span class="icon">💎</span>Донат</button></div>
<div class="section">✨ Скоро</div><div class="card muted">Здесь подключим реальные данные Coinso: баланс, игры, майнинг, рейтинг и Stars.</div>
</div><div class="nav"><button onclick="show('🏠 Главная')">🏠 Главная</button><button onclick="show('👤 Профиль')">👤 Профиль</button><button onclick="show('🎮 Игры')">🎮 Игры</button></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe?.user;if(u)document.getElementById('username').textContent='@'+(u.username||u.first_name||'user');}
function show(n){tg?.showAlert?.(n+' — раздел готов к подключению к Coinso.');}
function openGame(n){tg?.showAlert?.(n+' — здесь позже подключим настоящую игру из Coinso.');}
</script></body></html>
